[paths]
incoming_dir = "data/incoming"
warehouse    = "output/warehouse.db"
output_dir   = "output"

[sessionization]
inactivity_gap_minutes = 30

[dedup]
near_duplicate_window_seconds = 2.0

[validation]
min_event_date           = "2020-01-01"
future_tolerance_minutes = 10
allowed_events = [
  "app_open", "page_view", "search", "view_product", "add_to_cart",
  "remove_from_cart", "begin_checkout", "add_payment_info", "purchase", "logout",
]

[contract]
fields            = ["event_id", "user_id", "event_name", "ts", "device", "country", "channel", "app_version", "properties"]
property_fields   = ["product_id", "price"]

[funnel]
name  = "checkout"
steps = ["view_product", "add_to_cart", "begin_checkout", "add_payment_info", "purchase"]
min_sample_size    = 30
segment_dimensions = ["device", "channel", "country", "app_version"]

[anomaly]
min_daily_sessions   = 50
max_p_value          = 0.001
min_relative_decline = 0.15

[alerts]
max_quarantine_rate       = 0.05
max_conflicting_duplicates = 100

[runtime]
lock_timeout_minutes = 120